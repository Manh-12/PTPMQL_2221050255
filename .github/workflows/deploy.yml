
name: Deploy .NET 10 MVC to MonsterASP.net

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monsterasp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./PTPMQL_MVC.csproj

      - name: Build project
        run: dotnet build ./PTPMQL_MVC.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish ./PTPMQL_MVC.csproj --configuration Release --no-build --output ./publish

      - name: Verify publish output
        run: |
          test -f ./publish/PTPMQL_MVC.dll
          test -f ./publish/PTPMQL_MVC.deps.json
          test -f ./publish/PTPMQL_MVC.runtimeconfig.json

      - name: Validate FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_SERVER_DIR"

      - name: Deploy to MonsterASP.net
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          security: loose
