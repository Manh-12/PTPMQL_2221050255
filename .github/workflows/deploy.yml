name: Deploy .NET 10 MVC to MonsterASP.net

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Cài đặt .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 2. Đóng gói ứng dụng (Đã sửa lỗi tự động tìm file .csproj bất kể vị trí thư mục)
      - name: Publish project
        run: |
          PROJECT_FILE=$(find . -name "*.csproj" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ LỖI: Không tìm thấy bất kỳ file .csproj nào trong repo!"
            exit 1
          fi
          echo "🚀 Tìm thấy file dự án tại: $PROJECT_FILE"
          dotnet publish "$PROJECT_FILE" -c Release -o ./publish

      # 3. TẮT SERVER: Tạo và upload app_offline.htm bằng curl
      - name: ⛔ Stop Server (Upload app_offline.htm)
        run: |
          echo "<html><body><h1>Updating...</h1></body></html>" > app_offline.htm
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T app_offline.htm "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm"

      # 4. DEPLOY CODE
      - name: 🚀 Deploy App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/
          security: loose
          exclude: |
            **/app_offline.htm

      # 5. BẬT SERVER: Xóa file app_offline.htm bằng curl (Luôn chạy kể cả khi deploy lỗi)
      - name: ▶️ Start Server (Delete app_offline.htm)
        if: always()
        run: |
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -Q "-DELE /wwwroot/app_offline.htm" || true
