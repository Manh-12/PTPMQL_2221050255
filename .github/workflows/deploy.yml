
name: Deploy .NET 10 MVC to MonsterASP.net

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -name "*.csproj" \
            -not -path "*/obj/*" \
            -not -path "*/bin/*" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Cannot find .csproj"
            exit 1
          fi

          dotnet publish "$PROJECT_FILE" \
            -c Release \
            --no-restore \
            -o ./publish

      - name: Verify published files
        run: |
          test -f ./publish/PTPMQL_MVC.dll
          test -f ./publish/PTPMQL_MVC.deps.json
          test -f ./publish/PTPMQL_MVC.runtimeconfig.json
          echo "Publish files verified."

      - name: Deploy App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: /wwwroot/
          security: loose
